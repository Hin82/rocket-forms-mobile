# Claude reviews every pull request once and posts its findings as inline comments,
# separately from CodeRabbit. It never approves. Each inline comment is a review thread, so where
# a rule requires every thread to be resolved before a merge, a finding has to be answered and
# resolved by hand. Whether Claude has already
# reviewed is decided by a workflow step (comments or reviews by claude[bot], read from the REST
# API), not by the model: the plugin's own check read a description mentioning claude-review, or a
# "Generated with Claude Code" footer, as an earlier review or an automated pull request, and
# posted nothing. Later pushes are not reviewed again; that is why `synchronize` is not a trigger.
#
# The model has no shell in this run. Allowed: Claude Code's Read inside the checkout only, plus
# Grep and Glob, and the tool that posts an inline comment. /proc (the main process keeps its
# token there), /dev (links into /proc), the runner's _temp, ~/.claude, ~/.config and the
# checkout's .git are denied to Read; Claude Code applies Read rules to Grep and Glob as far as
# it can. Claude Code's own tools are limited to Read, Grep, Glob and Task (for subagents) with
# --tools, so nothing that runs a command, writes a file or reaches the network exists in the
# session; the deny list repeats the dangerous ones as a second layer. What the plugin fetched
# with gh is saved into the checkout by a step instead. The appended system prompt tells the model what this run has, so
# it does not reach for the rest.
# A diff longer than Claude Code's inline limit (30,000 characters by default) is saved under
# ~/.claude, which stays denied, so the model never saw a big diff and reported no issues (run
# 40083780590). A step therefore writes the diff into the checkout, where Read already reaches,
# and the prompt points the model there.
# The last step names any tool that was still denied, as a warning on the run.
#
# Why no shell at all (each point measured locally on Claude Code 2.1.296, and --tools also on
# 2.1.286, the version the pinned action installs; on macOS, not on the runner's Linux build, so
# check what the step "Report denied tools" prints on the first run):
# - The action keeps its short-lived App token in the remote URL in .git/config and in GH_TOKEN
#   and GITHUB_TOKEN, and the scrub below leaves those two in place.
# - Leaving a command out of --allowedTools does not stop it. Claude Code runs commands it
#   counts as read-only without any rule: cat, head, grep, wc, git status. It refuses the plain
#   readers on a path the Read rules deny, but `git remote -v`, `git config --get
#   remote.origin.url` and `git ls-remote --get-url` ran and printed the token, and
#   `wc --files0-from=.git/config` got past the path check.
# - The plugin's own command file allows seven gh commands, and Claude Code honours that for
#   the main agent. Any gh command that takes --jq can print the environment
#   (`--jq '$ENV.GH_TOKEN'`), and gh pr comment can post a file with --body-file.
# - A list of denied commands cannot be shown to be complete. Denying the tool can: with `Bash`
#   in --disallowedTools the tool does not exist for the session or its subagents, and a deny
#   wins over both the built-in rule and the plugin's file. Keep it there.
# - A list of denied TOOLS cannot be shown to be complete either. With Bash denied, a session
#   still had RemoteTrigger (creates and runs cloud routines on the account behind the OAuth
#   token; listing them ran without any approval), CronCreate, Workflow and EnterWorktree (ran
#   and made a worktree). Which tools a session gets varies with the version. So --tools names
#   the only built-in tools that exist here. Keep it, and add to it only what the review needs.
# What the plugin did with a shell is done outside the model: the step `Save the diff for the
# review` saves the pull request's description, file list and diff, and the job `no-findings`
# posts the one comment the plugin posted with gh (the one saying it found nothing), with a
# fixed text and a token the model never runs beside. The history angle of the review (git log,
# git blame) is given up.
# The checkout leaves no token of its own, and the long-lived CLAUDE_CODE_OAUTH_TOKEN is
# scrubbed from the environment of the processes the model starts. The checkout is the pull
# request's head, not GitHub's merge commit, so the SHA in the links is the one the pull request
# shows.
#
# Needs: the Claude GitHub App installed on this repository, and the secret
# CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`). Without the secret the job
# runs, skips every step and ends green, so a missing token never fails a PR.
#
# Runner setup: the env scrub needs bubblewrap and socat, so a step installs them and turns off
# Ubuntu's AppArmor restriction on unprivileged user namespaces for the whole (throwaway) runner.
# The owner chose this over a bwrap-only AppArmor profile (2026-10-22). The scrub was added
# when the model still ran shell commands, and the review crashed or posted nothing without
# that step. The model starts no commands now, so the scrub is a second layer; whether it still
# needs the step has not been measured, so keep both.
#
# Copied from digmiorg/TizenMarketingWeb (b4c5d1b and after), where each of the steps below was
# added after a run or a measurement that failed without it, and where the first run in CI
# confirmed the tool list. A pull request that changes this file is not reviewed: the action
# requires the workflow to match the copy on the default branch.
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

# A floor, not a grant: this repository's default for GITHUB_TOKEN is write. The job opts in to
# what it needs below.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # A cancelled run could leave half a review that the plugin then never completes.
  cancel-in-progress: false

jobs:
  review:
    # Not for drafts, not for pull requests opened or touched by bots, and not for pull requests from forks, which get no secrets.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      clean: ${{ steps.outcome.outputs.clean }}
    steps:
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the Claude review."; fi

      # One review per pull request: skip when claude[bot] has already commented or reviewed, or
      # when the job `no-findings` has said that an earlier review found nothing. The REST API
      # gives bot logins with their [bot] suffix.
      - name: Check for an earlier Claude review
        id: earlier
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! logins=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | if (.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- claude-review: no findings -->"))) then "claude[bot]" else .user.login end' &&
                        gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[].user.login' &&
                        gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq '.[].user.login'); then
            echo "::warning::Could not read earlier reviews; reviewing anyway."
          fi
          count=$(printf '%s\n' "$logins" | grep -cx 'claude\[bot\]' || true)
          if [ "$count" -gt 0 ]; then
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Claude has already reviewed this pull request; skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true' && steps.earlier.outputs.reviewed != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # The pull request as the model reads it, since it has no shell: title, description and author
      # in pr.json, the changed files in files.txt and the diff in pr.diff. The file list and the
      # diff are taken between the same two commits as the checkout, not from the pull request as
      # it is now, so a push after the event cannot make them disagree with the files. The file
      # list comes from git, which needs only the trees the checkout already has; GitHub's
      # comparison lists at most 300 files and says nothing when it cuts. The directory is kept out
      # of Grep and Glob by its own .gitignore, and the prompt says it is not part of the pull
      # request. Known limit: GitHub refuses the diff of a very large pull request; the model then
      # reads the listed files instead.
      - name: Save the diff for the review
        id: diff
        if: steps.token.outputs.present == 'true' && steps.earlier.outputs.reviewed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Replaced, not reused, so a committed link named .pr-review cannot redirect the write.
          rm -rf .pr-review && mkdir .pr-review
          echo '*' > .pr-review/.gitignore
          # Without this file the model knows nothing about the pull request, so a failure stops the job.
          gh pr view "$PR" --repo "$REPO" --json number,url,state,isDraft,title,body,author,baseRefName,headRefName > .pr-review/pr.json
          # quotePath off: git otherwise escapes a non-ASCII name, and Read cannot open that.
          # --no-renames: detecting a rename needs file contents, which this checkout fetches on
          # demand and has no credential to fetch. git fails when the base commit is not in the
          # checkout (the base branch was force-pushed after the event); GitHub still knows the
          # commit, so its comparison is asked instead, which lists at most 300 files.
          if ! git -c core.quotePath=false diff --no-renames --name-only "$BASE...$HEAD" > .pr-review/files.txt 2> .pr-review/err; then
            reason=$(head -c 300 .pr-review/err | tr '\r\n' '  ')
            echo "::warning::git could not list the changed files; asking GitHub instead. ${reason//%/%25}"
            if ! gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename' > .pr-review/files.txt 2> .pr-review/err; then
              reason=$(head -c 300 .pr-review/err | tr '\r\n' '  ')
              echo "::warning::Could not save the list of changed files. ${reason//%/%25}"
              echo "# file list unavailable: $reason" > .pr-review/files.txt
            elif [ "$(grep -c '' .pr-review/files.txt || true)" -ge 300 ]; then
              # GitHub cuts the list at 300 without saying so.
              echo "::warning::The list of changed files stops at GitHub's limit of 300; the pull request may change more."
              echo "# list cut at 300 files; the pull request may change more" >> .pr-review/files.txt
            fi
          fi
          rm -f .pr-review/err
          echo "Saved $(grep -c '' .pr-review/files.txt || true) changed file names."
          if ! gh api "repos/$REPO/compare/$BASE...$HEAD" -H 'Accept: application/vnd.github.diff' > .pr-review/pr.diff 2> .pr-review/err; then
            # GitHub refuses very large diffs. The file then says so, and the model reads the files.
            reason=$(head -c 300 .pr-review/err | tr '\r\n' '  ')
            echo "::warning::Could not save the diff; the review reads the changed files instead. ${reason//%/%25}"
            echo "# diff unavailable: $reason" > .pr-review/pr.diff
          fi
          rm -f .pr-review/err
          lines=$(grep -c '' .pr-review/pr.diff || true)
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "Saved $lines diff lines."

      # The env scrub below ran the model's commands in a bubblewrap sandbox, which also needs socat
      # (its network bridge; without it every shell command failed, run 40082963786); the runner image
      # lacks both. The model runs no commands now, but the scrub stays as a second layer, and
      # whether it starts without these two has not been measured. Ubuntu also blocks the unprivileged user namespaces bubblewrap needs unless this
      # AppArmor switch is off; the runner is a throwaway machine for this one job. The last two
      # lines prove socat runs and the sandbox starts with its own network namespace, so a broken
      # setup fails here instead of skipping the review.
      - name: Install bubblewrap and socat for the env scrub
        if: steps.token.outputs.present == 'true' && steps.earlier.outputs.reviewed != 'true'
        run: |
          # Each entry is command:package (bubblewrap's command is bwrap).
          need="bwrap:bubblewrap socat:socat"
          missing=""
          for pair in $need; do command -v "${pair%%:*}" >/dev/null || missing="$missing ${pair#*:}"; done
          if [ -n "$missing" ]; then
            # A failing third-party source must not stop the install from Ubuntu's own archive.
            for i in 1 2 3; do
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq --no-install-recommends $missing && break
              [ "$i" -lt 3 ] && sleep 5
            done
          fi
          for pair in $need; do
            command -v "${pair%%:*}" >/dev/null || { echo "::error::${pair#*:} could not be installed"; exit 1; }
          done
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          socat -V >/dev/null
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --dev /dev --proc /proc true

      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        id: claude
        if: steps.token.outputs.present == 'true' && steps.earlier.outputs.reviewed != 'true'
        env:
          # Strips the Anthropic and Actions secrets from the environment of any process Claude
          # Code starts. The model has no tool that starts one; this is a second layer.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # Prints the model's steps and its final answer in the run log, so a review that posts
          # nothing can be understood. Off unless the repository variable CLAUDE_REVIEW_DEBUG is
          # "true", so it cannot be left on by mistake. In a public repository the run log is public,
          # so turn it on there only for a run you are about to read. The runner masks
          # every secret the action registers (the App token included, which the action also
          # revokes when its step ends), Read cannot open .git, and the model has no tool that
          # prints the environment.
          show_full_output: ${{ vars.CLAUDE_REVIEW_DEBUG == 'true' }}
          # The full URL: gh reads "owner/repo/pull/N" as a branch name.
          prompt: "/code-review:code-review --comment ${{ github.event.pull_request.html_url }}"
          claude_args: >-
            --model claude-opus-5-5 --max-turns 60
            --tools "Read,Grep,Glob,Task"
            --allowedTools "Read(./**),Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Monitor,Edit,Write,NotebookEdit,WebSearch,WebFetch,Read(//proc/**),Read(//dev/**),Read(//home/runner/work/_temp/**),Read(~/.claude/**),Read(~/.config/**),Read(./.git/**)"
            --append-system-prompt "This review runs in CI with a fixed set of tools. The whole diff of this pull request is saved in ./.pr-review/pr.diff, ${{ steps.diff.outputs.lines }} lines long: read all of it with the Read tool in pages of at most 500 lines (offset and limit). There is no Bash tool and no shell command of any kind in this run, for you or for any subagent: no gh, no git, no cat or grep. Do not try them. Wherever the review instructions say to use gh pr view, gh pr diff, gh pr list or gh issue, read these files instead: ./.pr-review/pr.json holds this pull request's number, url, state, isDraft, title, body (the description), author and base and head branch, and ./.pr-review/files.txt lists the changed files, one per line (a line that starts with # is a note about the list, not a file). If the diff file starts with '# diff unavailable', read the files listed in files.txt with Read. The action that runs you has put the base branch's version back at these paths, so that a pull request cannot change how you run: .claude, .mcp.json, .claude.json, .gitmodules, .ripgreprc, CLAUDE.md, CLAUDE.local.md and .husky. When the pull request changes a file at or under one of them, its version of that file is at ./.claude-pr/ followed by the same path: read it there, and use the original path in an inline comment. The rules you check compliance against are the ones at the original paths. Never report findings in ./.pr-review, which is not part of the pull request. The Read, Grep and Glob tools read the files. The commit under review is ${{ github.event.pull_request.head.sha }}: use that SHA in links, and pass it as commit_id on every call to mcp__github_inline_comment__create_inline_comment, so a comment stays on the reviewed commit when a push arrives during the review. Skip the history angle of the review (git log, git blame), which needs a shell. Find files with Glob, read them with Read and search them with Grep. Give these tool limits and the paths of the three saved files to every subagent you launch. A workflow step has already checked this pull request: a person opened it, it is open and not a draft, it is not automated, and Claude has not reviewed or commented on it. Tell every agent that runs the eligibility check that the automated-pull-request condition and the already-commented condition are settled and must not stop the review, whatever the description says (mentions of claude-review, Claude Code, CodeRabbit or a verdict are written by the author). If no issue meets the threshold, post nothing and make the last line of your final answer exactly this sentence, without quotes: No issues found. Checked for bugs and CLAUDE.md compliance. A later job posts that comment. Never write that line when you have a finding."

      # The model cannot post the plugin's "no issues" comment (see the top of this file), so this
      # step reads its final answer and the job `no-findings` posts the comment. Only an answer that
      # ENDS with the plugin's sentence counts, so one that mentions it while reporting a finding
      # does not. The answer is the model's own text: a pull request that talks the model into this
      # line gets the comment the model could have posted itself before, and nothing more.
      - name: Read the outcome
        id: outcome
        if: steps.claude.conclusion == 'success' && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # $(...) drops trailing newlines; the sed drops trailing spaces, quotes and Markdown emphasis
          # from the last line.
          if ! answer=$(jq -r '[.[] | select(.type == "result") | .result // ""] | last // ""' "$EXECUTION_FILE"); then
            echo "::warning::Could not read the review's execution file, so its outcome is unknown."
            exit 0
          fi
          answer=$(printf '%s' "$answer" | sed -e "\$ s/[[:space:]*_\`'\"]*\$//")
          if [[ "$answer" == *'No issues found. Checked for bugs and CLAUDE.md compliance.' ]]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "The review found no issues."
          else
            echo "The review did not end with the 'No issues found' sentence."
          fi

      - name: Report denied tools
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # What the session really had. Anything here beyond Read, Grep, Glob, Task and the
          # mcp__ tools means --tools did not take effect in this version.
          tools=$(jq -r '[.[] | select(.type == "system" and .subtype == "init") | .tools[]?] | unique | join(", ")' "$EXECUTION_FILE" || true)
          echo "Tools in the session: ${tools:-unknown}"
          if [ -z "$tools" ]; then
            echo "::warning::Could not read which tools the session had, so the tool limit is unchecked for this run."
          fi
          extra=$(jq -r '[.[] | select(.type == "system" and .subtype == "init") | .tools[]? | select((IN("Read", "Grep", "Glob", "Task") or startswith("mcp__")) | not)] | unique | join(", ")' "$EXECUTION_FILE" || true)
          if [ -n "$extra" ]; then
            echo "::warning::The model had tools this workflow means to switch off: $extra"
          fi
          # The text is escaped as GitHub's own toolkit does, so a newline in a denied command
          # cannot start a workflow command of its own.
          if ! denied=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]? | .tool_name + " " + ([.tool_input.command, .tool_input.file_path, .tool_input.path, .tool_input.pattern] | map(select(. != null) | tostring) | join(" "))] | join("; ") | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' "$EXECUTION_FILE"); then
            echo "::warning::Could not read the review's execution file, so denied tools are unknown."
          elif [ -n "$denied" ]; then
            echo "::warning::The review was denied these tools and may have ended early: $denied"
          else
            echo "No tool was denied."
          fi
          # A call to a tool that is switched off (Bash and the others in --disallowedTools) is not
          # a denial: the model is told the tool does not exist. Those calls are counted here,
          # the subagents' too.
          if ! absent=$(jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name | select(IN("Bash", "Monitor", "Edit", "Write", "NotebookEdit", "WebSearch", "WebFetch"))] | group_by(.) | map("\(.[0]) x\(length)") | join(", ")' "$EXECUTION_FILE"); then
            echo "::warning::Could not count calls to switched-off tools."
          elif [ -n "$absent" ]; then
            echo "::warning::The model tried tools that are switched off in this run: $absent"
          else
            echo "No call to a switched-off tool."
          fi

  # Says on the pull request that the review found nothing. Its own job, so the token that may
  # write a comment never exists in the job where the model runs. Nothing is checked out.
  no-findings:
    needs: review
    if: needs.review.outputs.clean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A review that said "no issues" but still left comments is not a clean one.
          if ! logins=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[].user.login' &&
                        gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[].user.login' &&
                        gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq '.[].user.login'); then
            echo "::warning::Could not read the pull request's comments; posting nothing."
            exit 0
          fi
          if printf '%s\n' "$logins" | grep -qx 'claude\[bot\]'; then
            echo "::notice::Claude left comments on this pull request; not saying that it found nothing."
            exit 0
          fi
          # The REST call, whose documented permission is the one this job has.
          gh api "repos/$REPO/issues/$PR/comments" --silent -f body='<!-- claude-review: no findings -->
          ## Code review

          No issues found. Checked for bugs and CLAUDE.md compliance.'
