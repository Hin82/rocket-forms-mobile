# Claude reviews every pull request once and posts its findings as inline comments,
# separately from CodeRabbit. It never approves or blocks a merge. The review plugin stops
# when Claude has already commented on the pull request, so later pushes are not reviewed
# again; that is why `synchronize` is not a trigger.
#
# The gh commands the review plugin runs, and `git rev-parse` for the full commit SHA its links
# need, must be allowed here too: in the action's
# non-interactive mode the plugin's own allowed-tools have not been enough in practice (the runs
# showed permission denials), and denied calls end the review early. The last step names any
# tool that was still denied, as a warning on the run, so a review that ended early is visible.
# git log, diff, show and blame are left out on purpose: they all take --output=<file>, which
# turns them into file writes (and, through .git/config, into running commands); gh pr diff and
# gh pr view cover what they would give. The checkout is the pull request's head, not GitHub's
# merge commit, so the SHA in the links is the one the pull request shows.
# The gh list mirrors the plugin's allowed-tools in anthropics/claude-code main on 2026-10-18.
#
# Needs: the Claude GitHub App installed on this repository, and the secret
# CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`). Without the secret the job
# is skipped, so a missing token never fails a PR.
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # A cancelled run could leave half a review that the plugin then never completes.
  cancel-in-progress: false

jobs:
  review:
    # Not for drafts, not for pull requests opened or touched by bots, and not for pull requests from forks, which get no secrets.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the Claude review."; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        id: claude
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # The full URL: gh reads "owner/repo/pull/N" as a branch name.
          prompt: "/code-review:code-review --comment ${{ github.event.pull_request.html_url }}"
          claude_args: '--model claude-opus-5-5 --max-turns 40 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git rev-parse:*)"'

      - name: Report denied tools
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # The text is escaped as GitHub's own toolkit does, so a newline in a denied command
          # cannot start a workflow command of its own.
          if ! denied=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]? | .tool_name + " " + ((.tool_input.command // "") | tostring)] | join("; ") | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")' "$EXECUTION_FILE"); then
            echo "::warning::Could not read the review's execution file, so denied tools are unknown."
          elif [ -n "$denied" ]; then
            echo "::warning::The review was denied these tools and may have ended early: $denied"
          else
            echo "No tool was denied."
          fi
